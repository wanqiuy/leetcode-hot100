<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding:24px}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#38bdf8);color:#fff;padding:28px 24px}
header .wrap{padding:0}
header h1{font-size:22px}
header p{opacity:.85;font-size:13px;margin-top:4px}
.back{color:#fff;opacity:.9;font-size:13px;text-decoration:none}
.crumb{font-size:12px;opacity:.85;margin-top:6px}
.crumb a{color:#fff;text-decoration:underline}
.toc{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 20px;margin:20px 0}
.toc h2{font-size:15px;margin-bottom:8px}
.prob{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px;margin-bottom:22px}
.prob h2{font-size:17px;margin-bottom:10px}
.prob h3{font-size:14px;color:#2563eb;margin:16px 0 6px}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;vertical-align:middle}
.easy{color:#16a34a;background:#dcfce7}.medium{color:#d97706;background:#fef3c7}.hard{color:#dc2626;background:#fee2e2}
.desc{background:#f9fafb;border-left:3px solid #2563eb;padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.ex{background:#f3f4f6;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:8px;white-space:pre-wrap;font-family:"SF Mono",Menlo,Consolas,monospace}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;font-family:"SF Mono",Menlo,Consolas,monospace}
.diagram{background:#fffbeb;color:#78350f;border:1px solid #fde68a;white-space:pre}
.cx{font-size:12px;color:#6b7280;margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:8px 0 22px;flex-wrap:wrap}
.pager a{flex:1;min-width:150px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;font-size:13px;color:#2563eb;text-decoration:none}
.pager a:hover{background:#eff6ff}
.pager a.mid{flex:0 1 auto;text-align:center;color:#6b7280}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:inherit;transition:box-shadow .2s}
.item:hover{box-shadow:0 4px 14px rgba(37,99,235,.12)}
.item .no{color:#6b7280;font-variant-numeric:tabular-nums;min-width:56px}
.item .ti{flex:1;font-size:15px}
.item .go{font-size:12px;color:#9ca3af}
footer{text-align:center;color:#9ca3af;font-size:12px;padding:20px}


/* 标记控件 v2 */
.mk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.mk input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:#16a34a;margin:0}
.lv{border:1.5px solid #d1d5db;background:#fff;border-radius:999px;padding:3px 14px;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s}
.lv:hover{transform:translateY(-1px)}
.lv.on-high{background:#dcfce7;border-color:#16a34a;color:#16a34a;font-weight:600}
.lv.on-mid{background:#fef3c7;border-color:#d97706;color:#d97706;font-weight:600}
.lv.on-low{background:#fee2e2;border-color:#dc2626;color:#dc2626;font-weight:600}
/* 分类页卡片 */
.card{display:block;background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:12px;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 16px rgba(37,99,235,.10)}
.card .row1{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;cursor:pointer}
.card .no{color:#9ca3af;font-variant-numeric:tabular-nums;min-width:52px;font-size:14px}
.card .ti{flex:1;font-size:15px;font-weight:500;color:#1f2937}
.card .row1:hover .ti{color:#2563eb}
.card .go{font-size:12px;color:#c0c4cc}
.card .row2{display:flex;align-items:center;gap:10px;padding:0 18px 12px 70px;font-size:13px;color:#6b7280;flex-wrap:wrap}
.card .sep{color:#e5e7eb}
/* 单题页标记条 */
.markbar{display:flex;align-items:center;gap:12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px;flex-wrap:wrap}
.markbar .lab{color:#6b7280;font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><a class="back" href="index.html">← 返回目录</a><h1>技巧</h1><p>共 5 题 · 每题独立页面 · 代码语言：Java</p></div></header>
<div class="wrap">
<div class="card"><div class="row1" onclick="location.href='pages/17-tricks/p136.html'"><span class="no">136</span><span class="ti">只出现一次的数字</span><span class="badge easy">简单</span><span class="go">查看题解 →</span></div><div class="row2"><span class="mkbox" data-n="136"></span></div></div>
<div class="card"><div class="row1" onclick="location.href='pages/17-tricks/p169.html'"><span class="no">169</span><span class="ti">多数元素</span><span class="badge easy">简单</span><span class="go">查看题解 →</span></div><div class="row2"><span class="mkbox" data-n="169"></span></div></div>
<div class="card"><div class="row1" onclick="location.href='pages/17-tricks/p75.html'"><span class="no">75</span><span class="ti">颜色分类</span><span class="badge medium">中等</span><span class="go">查看题解 →</span></div><div class="row2"><span class="mkbox" data-n="75"></span></div></div>
<div class="card"><div class="row1" onclick="location.href='pages/17-tricks/p31.html'"><span class="no">31</span><span class="ti">下一个排列</span><span class="badge medium">中等</span><span class="go">查看题解 →</span></div><div class="row2"><span class="mkbox" data-n="31"></span></div></div>
<div class="card"><div class="row1" onclick="location.href='pages/17-tricks/p287.html'"><span class="no">287</span><span class="ti">寻找重复数</span><span class="badge medium">中等</span><span class="go">查看题解 →</span></div><div class="row2"><span class="mkbox" data-n="287"></span></div></div>
</div>
<footer>LeetCode 热题100 题解手册 · Java</footer>





<script>
(function(){
  var KEY='hot100-marks';
  function load(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}} }
  function save(m){ localStorage.setItem(KEY, JSON.stringify(m)); }
  function get(n){ var m=load(); return m[n]||{done:false,level:''}; }
  function set(n,done,level){ var m=load(); m[n]={done:done,level:level}; save(m); }
  window.HOT100={load:load,get:get,set:set};

  window.renderMark=function(el,n){
    var st=get(n);
    el.innerHTML='';
    // 勾选
    var lab=document.createElement('label'); lab.className='mk';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!st.done;
    cb.addEventListener('change',function(e){ e.stopPropagation(); var s=get(n); set(n,cb.checked,s.level); });
    lab.appendChild(cb); lab.appendChild(document.createTextNode(' 做过'));
    el.appendChild(lab);
    // 分隔
    var sep=document.createElement('span'); sep.className='sep'; sep.textContent='|'; el.appendChild(sep);
    el.appendChild(document.createTextNode('熟练度 '));
    // 三档按钮
    [['high','高'],['mid','中'],['low','低']].forEach(function(pair){
      var b=document.createElement('button'); b.className='lv'+(st.level===pair[0]?' on-'+pair[0]:'');
      b.textContent=pair[1];
      b.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        var s=get(n);
        set(n, s.done, s.level===pair[0]?'':pair[0]);
        renderMark(el,n);
        if(window.onMarkChange) window.onMarkChange();
      });
      el.appendChild(b);
    });
  };
})();
</script>

<script>
document.querySelectorAll('.mkbox').forEach(function(el){ renderMark(el, el.dataset.n); });
</script>
</body>
